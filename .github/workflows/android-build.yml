name: Android Internal Test Build

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Set up Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Install Gradle 8.7
      - name: Install Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.7

      # 4. Create local.properties so Android build can find the SDK
      - name: Configure Android SDK path
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

